name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` over `npm install`: it installs exactly the lockfile and fails
      # if package.json and the lock have drifted, which is a real signal.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # The only check here that exercises the monorepo wiring end to end. A
      # passing typecheck does not prove Metro can resolve @friends/* from the
      # app — this does, and it is where a broken metro.config.js shows up.
      - name: Bundle (proves workspace resolution)
        run: npx expo export --platform ios --output-dir /tmp/expo-export

  database:
    name: Migrations and RLS policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The real Supabase stack, not the local auth shim. This is the check that
      # matters: it proves the migration applies against the genuine auth schema
      # and that supabase/tests/00_auth_shim.sql has not drifted from reality.
      - name: Start Supabase
        run: npx supabase start

      - name: Replay migrations and seed
        run: npx supabase db reset

      # Run through psql rather than the CLI: ON_ERROR_STOP is what turns a
      # raised assertion into a non-zero exit, and psql is preinstalled on
      # ubuntu-latest. Note these tests do NOT load the local auth shim — the
      # real stack already provides auth.users and auth.uid().
      - name: Policy tests
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/01_identity_policies.sql

      # Catches the classic drift: someone adds a migration and forgets to
      # regenerate types. Compares against the committed file rather than
      # trusting that it was updated.
      - name: Generated types are current
        run: |
          npx supabase gen types typescript --local --schema public > /tmp/database.types.ts
          if ! diff -u lib/database.types.ts /tmp/database.types.ts; then
            echo "::error::lib/database.types.ts is stale. Run 'npm run db:types' and commit."
            echo "----- BEGIN EXPECTED database.types.ts -----"
            cat /tmp/database.types.ts
            echo "----- END EXPECTED database.types.ts -----"
            exit 1
          fi

      # Printing the expected file above is deliberate. A diff fragment tells you
      # something drifted; the whole file lets anyone without a working local
      # Supabase stack recover the correct content from the log.
      - name: Upload generated types
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: /tmp/database.types.ts
